{% extends "cinema/base.html" %}

{% block title %}{{ title }} - Frame{% endblock %}

{% block content %}
    <section class="container form-page">
        <a class="back-link" href="{% url 'cinema:film_list' %}">← Back to films</a>
        <p class="eyebrow">Collection management</p>
        <h1>{{ title }}</h1>
        <form class="site-form" method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button class="button" type="submit">Save film</button>
                <a class="text-link" href="{% url 'cinema:film_list' %}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
