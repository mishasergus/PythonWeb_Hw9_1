{% extends "cinema/base.html" %}

{% block title %}Delete {{ hall.name }} - Frame{% endblock %}

{% block content %}
    <section class="container form-page">
        <a class="back-link" href="{% url 'cinema:hall_detail' hall_id=hall.id %}">← Back to hall</a>
        <p class="eyebrow">Hall management</p>
        <h1>Delete this hall?</h1>
        <p class="form-intro">“{{ hall.name }}” and its associated tickets will be permanently removed.</p>
        <form class="site-form" method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button class="button button-danger" type="submit">Delete hall</button>
                <a class="text-link" href="{% url 'cinema:hall_detail' hall_id=hall.id %}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
